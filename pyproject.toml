[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sciminilm"
version = "0.1.0"
description = "SciMiniLM: 77M-parameter Decoder-Only Scientific Language Model (EE656 Course Project)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]
triton = [
    "triton>=2.1.0",
]

[tool.setuptools.packages.find]
include = ["sciminilm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
